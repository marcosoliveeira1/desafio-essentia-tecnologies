name: essentia-todo-list

services:
  mysql:
    image: mysql:8
    container_name: essentia-todo-list-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_USER: ${MYSQL_USER:-todo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-todo}
      MYSQL_DATABASE: todo_dev
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  # T21: histórico de atividades (extra Fase 6). Nome do serviço `mongo`
  # (T25 usa esse nome no MONGO_URL do backend).
  mongo:
    image: mongo:7
    container_name: essentia-todo-list-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      # Init (usuários/senhas) aplica SOMENTE na 1ª inicialização do volume
      # (datadir vazio) — volume legado não recebe auth: ver README/smoke.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-root}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:-todo}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-todo}
    volumes:
      - mongo_data:/data/db
      - ./docker/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  # T25: backend prod-like (build local, sem publicar 3000 no host por default).
  backend:
    build: ./backend
    container_name: essentia-todo-list-backend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${MYSQL_USER:-todo}
      DB_PASSWORD: ${MYSQL_PASSWORD:-todo}
      DB_DATABASE: todo_dev
      MONGO_URL: mongodb://${MONGO_APP_USERNAME:-todo}:${MONGO_APP_PASSWORD:-todo}@mongo:27017/todo_activity?authSource=admin
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET ausente — exporte JWT_SECRET com 32+ chars antes do up}
      JWT_EXPIRES_IN: 12h
      # Demo consciente: Swagger em production é opt-in (spec hardening-03,
      # PR-06 / Assumption "Swagger em production"). Remova para fechar /api/docs.
      SWAGGER_ENABLED: "true"
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  # T25: frontend prod-like (Caddy servindo SPA + proxy /api/* e /health p/ backend).
  frontend:
    build: ./frontend
    container_name: essentia-todo-list-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
  mongo_data:
