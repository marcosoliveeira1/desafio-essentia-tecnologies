<dialog #dialog (close)="onCancel()" (cancel)="onCancel()" class="w-80 rounded-2xl p-6 shadow-xl">
	<h3 class="mb-1 font-semibold text-gray-800">Excluir tarefa?</h3>
	@if (taskTitle()) {
		<p class="mb-4 text-sm text-gray-400">"{{ taskTitle() }}"</p>
	}
	<p class="mb-4 text-sm text-gray-400">Esta ação não pode ser desfeita.</p>
	<div class="flex justify-end gap-2 text-sm">
		<button
			type="button"
			(click)="onCancel()"
			class="rounded-full bg-gray-100 px-3 py-1.5 hover:bg-gray-200"
		>
			Cancelar
		</button>
		<button
			type="button"
			(click)="onConfirm()"
			class="rounded-full bg-red-600 px-3 py-1.5 text-white hover:bg-red-500"
		>
			Excluir
		</button>
	</div>
</dialog>
