<article
	[attr.draggable]="dragEnabled()"
	(dragstart)="onDragStart($event)"
	(dragend)="onDragEnd()"
	class="space-y-2 rounded-xl border border-gray-100 bg-white p-4 shadow-sm"
	[class.opacity-80]="task().completed"
>
	<div class="flex items-start gap-2">
		<span
			title="Arrastar para reordenar"
			(mousedown)="enableDrag()"
			(mouseup)="disableDrag()"
			(mouseleave)="disableDrag()"
			(touchstart)="enableDrag()"
			(touchend)="disableDrag()"
			class="mt-0.5 shrink-0 cursor-grab touch-none text-gray-300 hover:text-gray-500 active:cursor-grabbing"
		>
			<svg
				class="h-4 w-4"
				viewBox="0 0 16 16"
				fill="currentColor"
				aria-hidden="true"
			>
				<circle cx="5" cy="4" r="1.3" />
				<circle cx="11" cy="4" r="1.3" />
				<circle cx="5" cy="8" r="1.3" />
				<circle cx="11" cy="8" r="1.3" />
				<circle cx="5" cy="12" r="1.3" />
				<circle cx="11" cy="12" r="1.3" />
			</svg>
		</span>
		<input
			type="checkbox"
			[checked]="task().completed"
			(change)="toggle.emit()"
			class="mt-1 accent-[#263064]"
		/>
		<h3
			class="flex-1 text-sm font-semibold text-gray-800"
			[class.text-gray-400]="task().completed"
			[class.line-through]="task().completed"
		>
			{{ task().title }}
		</h3>
	</div>
	@if (task().description) {
		<p class="text-xs text-gray-400">{{ task().description }}</p>
	}
	<div
		class="flex items-center justify-between border-t border-gray-50 pt-2"
	>
		<span class="text-[11px] text-gray-400">{{
			task().createdAt | date: 'dd/MM HH:mm'
		}}</span>
		<div class="flex gap-0.5">
			<button
				type="button"
				title="Editar"
				(click)="edit.emit()"
				class="rounded p-1.5 text-gray-500 hover:bg-gray-100"
			>
				Editar
			</button>
			<button
				type="button"
				title="Excluir"
				(click)="delete.emit()"
				class="rounded p-1.5 text-gray-500 hover:bg-red-50 hover:text-red-500"
			>
				Excluir
			</button>
		</div>
	</div>
</article>
