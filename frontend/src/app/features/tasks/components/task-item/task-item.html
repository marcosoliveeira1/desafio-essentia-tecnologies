<article
	[attr.draggable]="dragEnabled()"
	(dragstart)="onDragStart($event)"
	(dragend)="onDragEnd()"
	class="space-y-2 rounded-xl border border-gray-100 bg-white p-4 shadow-sm"
	[class.opacity-80]="task().completed"
>
	<div class="flex items-start gap-2">
		<button
			type="button"
			(click)="toggle.emit()"
			[title]="task().completed ? 'Reabrir tarefa' : 'Concluir tarefa'"
			[attr.aria-pressed]="task().completed"
			[attr.aria-label]="task().completed ? 'Reabrir tarefa' : 'Concluir tarefa'"
			class="mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded-full border transition"
			[class.border-navy]="task().completed"
			[class.bg-navy]="task().completed"
			[class.text-white]="task().completed"
			[class.border-gray-300]="!task().completed"
			[class.text-transparent]="!task().completed"
			[class.hover:border-navy]="!task().completed"
		>
			<svg
				class="h-3 w-3"
				viewBox="0 0 12 12"
				fill="none"
				stroke="currentColor"
				stroke-width="2"
				aria-hidden="true"
			>
				<path
					d="M2.5 6.5l2.5 2.5 4.5-5.5"
					stroke-linecap="round"
					stroke-linejoin="round"
				/>
			</svg>
		</button>
		<h3
			class="flex-1 text-sm font-semibold text-gray-800"
			[class.text-gray-400]="task().completed"
			[class.line-through]="task().completed"
		>
			{{ task().title }}
		</h3>
		<span
			title="Arrastar para reordenar"
			(mousedown)="enableDrag()"
			(mouseup)="disableDrag()"
			(mouseleave)="disableDrag()"
			(touchstart)="enableDrag()"
			(touchend)="disableDrag()"
			class="mt-0.5 shrink-0 cursor-grab touch-none text-gray-300 hover:text-gray-500 active:cursor-grabbing"
		>
			<svg
				class="h-4 w-4"
				viewBox="0 0 16 16"
				fill="currentColor"
				aria-hidden="true"
			>
				<circle cx="5" cy="4" r="1.3" />
				<circle cx="11" cy="4" r="1.3" />
				<circle cx="5" cy="8" r="1.3" />
				<circle cx="11" cy="8" r="1.3" />
				<circle cx="5" cy="12" r="1.3" />
				<circle cx="11" cy="12" r="1.3" />
			</svg>
		</span>
	</div>
	@if (task().description) {
		<p class="text-xs text-gray-400">{{ task().description }}</p>
	}
	<div
		class="flex items-center justify-between border-t border-gray-50 pt-2"
	>
		<span class="text-[11px] text-gray-400">{{
			task().createdAt | date: 'dd/MM HH:mm'
		}}</span>
		<div class="flex gap-0.5">
			<button
				type="button"
				title="Editar"
				aria-label="Editar tarefa"
				(click)="edit.emit()"
				class="rounded p-1.5 text-gray-500 hover:bg-gray-100"
			>
				<svg
					class="h-4 w-4"
					viewBox="0 0 24 24"
					fill="none"
					stroke="currentColor"
					stroke-width="1.8"
					aria-hidden="true"
				>
					<path
						d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"
						stroke-linecap="round"
						stroke-linejoin="round"
					/>
				</svg>
			</button>
			<button
				type="button"
				title="Excluir"
				aria-label="Excluir tarefa"
				(click)="delete.emit()"
				class="rounded p-1.5 text-gray-500 hover:bg-red-50 hover:text-red-500"
			>
				<svg
					class="h-4 w-4"
					viewBox="0 0 24 24"
					fill="none"
					stroke="currentColor"
					stroke-width="1.8"
					aria-hidden="true"
				>
					<path
						d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
						stroke-linecap="round"
						stroke-linejoin="round"
					/>
				</svg>
			</button>
		</div>
	</div>
</article>
