<dialog
	#dialog
	(click)="onBackdropClick($event)"
	(cancel)="onCancel()"
	class="m-auto w-96 max-w-[90vw] rounded-2xl p-0 shadow-xl"
>
	<form
		[formGroup]="form"
		(ngSubmit)="onSubmit()"
		class="space-y-3 p-5"
		novalidate
	>
		<h3 class="font-semibold text-gray-800">{{ isEditing() ? 'Editar tarefa' : 'Criar tarefa' }}</h3>
		<div>
			<label for="taskTitle" class="mb-1 block text-xs font-medium text-gray-600"
				>Título *</label
			>
			<input
				id="taskTitle"
				type="text"
				formControlName="title"
				maxlength="255"
				placeholder="Título *"
				class="w-full rounded-lg bg-gray-100 px-4 py-2 text-sm focus:ring-2 focus:ring-gold focus:outline-none"
			/>
			<div class="mt-1 flex justify-between text-[11px]">
				@if (
					form.controls.title.touched &&
					(form.controls.title.hasError('required') ||
						form.controls.title.hasError('whitespace'))
				) {
					<p class="text-red-500">Título obrigatório</p>
				}
				<span class="ml-auto text-gray-400"
					>{{ form.controls.title.value.length }}/255</span
				>
			</div>
		</div>
		<div>
			<label for="taskDesc" class="mb-1 block text-xs font-medium text-gray-600"
				>Descrição (opcional)</label
			>
			<textarea
				id="taskDesc"
				rows="3"
				formControlName="description"
				maxlength="2000"
				placeholder="Descrição (opcional)"
				class="w-full rounded-lg bg-gray-100 px-4 py-2 text-sm focus:ring-2 focus:ring-gold focus:outline-none"
			></textarea>
		</div>
		<div class="flex justify-end gap-2 pt-1 text-sm">
			<button
				type="button"
				(click)="onCancel()"
				class="rounded-full bg-gray-100 px-4 py-1.5 hover:bg-gray-200"
			>
				Cancelar
			</button>
			<button
				type="submit"
				[disabled]="submitting()"
				class="rounded-full bg-navy px-4 py-1.5 font-medium text-white shadow-brand hover:bg-navy-dark disabled:opacity-60"
			>
				{{ isEditing() ? 'Salvar' : 'Criar' }}
			</button>
		</div>
	</form>
</dialog>
