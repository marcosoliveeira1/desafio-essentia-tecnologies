<div class="flex flex-wrap items-center gap-2 sm:gap-3">
	<div class="flex rounded-lg border border-gray-200 bg-white p-0.5 text-sm">
		<button
			type="button"
			(click)="setFilter('all')"
			class="rounded-md px-3 py-1 font-medium"
			[class.bg-navy]="store.filter() === 'all'"
			[class.text-white]="store.filter() === 'all'"
			[class.text-gray-500]="store.filter() !== 'all'"
			[class.hover:bg-gray-50]="store.filter() !== 'all'"
		>
			Todas
		</button>
		<button
			type="button"
			(click)="setFilter('pending')"
			class="rounded-md px-3 py-1 font-medium"
			[class.bg-navy]="store.filter() === 'pending'"
			[class.text-white]="store.filter() === 'pending'"
			[class.text-gray-500]="store.filter() !== 'pending'"
			[class.hover:bg-gray-50]="store.filter() !== 'pending'"
		>
			A fazer
		</button>
		<button
			type="button"
			(click)="setFilter('done')"
			class="rounded-md px-3 py-1 font-medium"
			[class.bg-navy]="store.filter() === 'done'"
			[class.text-white]="store.filter() === 'done'"
			[class.text-gray-500]="store.filter() !== 'done'"
			[class.hover:bg-gray-50]="store.filter() !== 'done'"
		>
			Concluídas
		</button>
	</div>
	<div class="relative">
		<button
			type="button"
			(click)="toggleSort()"
			class="rounded-lg border border-gray-200 bg-white px-3 py-1.5 text-sm font-medium text-gray-600 hover:bg-gray-50"
		>
			Ordenar: {{ sortLabel() }} ▾
		</button>
		@if (sortOpen()) {
			<div
				class="absolute top-full right-0 z-10 mt-2 w-36 rounded-lg border border-gray-200 bg-white py-1 text-sm shadow-lg"
			>
				<button
					type="button"
					(click)="setSort('manual')"
					class="block w-full px-3 py-1.5 text-left hover:bg-gray-50"
				>
					Ordem manual
				</button>
				<button
					type="button"
					(click)="setSort('recent')"
					class="block w-full px-3 py-1.5 text-left hover:bg-gray-50"
				>
					Mais recentes
				</button>
				<button
					type="button"
					(click)="setSort('old')"
					class="block w-full px-3 py-1.5 text-left hover:bg-gray-50"
				>
					Mais antigas
				</button>
			</div>
		}
	</div>
</div>
