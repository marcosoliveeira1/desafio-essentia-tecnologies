name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: todo_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      mongo:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: root
          MONGO_APP_USERNAME: todo
          MONGO_APP_PASSWORD: todo
        ports:
          - 27017:27017
        volumes:
          - ${{ github.workspace }}/docker/db:/docker-entrypoint-initdb.d:ro
        options: >-
          --health-cmd="mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend deps
        run: npm ci --prefix backend

      - name: Install frontend deps
        run: npm ci --prefix frontend

      - name: Backend typecheck
        run: npm run typecheck --prefix backend

      - name: Frontend typecheck
        run: npm run typecheck --prefix frontend

      - name: Backend lint
        run: npm run lint --prefix backend

      - name: Frontend lint
        run: npm run lint --prefix frontend

      - name: Backend audit
        run: npm audit --prefix backend --omit=dev --audit-level=high

      - name: Frontend audit
        run: npm audit --prefix frontend --omit=dev --audit-level=high

      - name: Prepare test database
        run: mysql -h127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS todo_test"

      - name: Backend unit tests
        run: npm test --prefix backend

      - name: Backend coverage gate
        run: npm run test:coverage --prefix backend

      - name: Backend build
        run: npm run build --prefix backend

      - name: Frontend tests
        run: npm test --prefix frontend -- --watch=false

      - name: Frontend build
        run: npm run build --prefix frontend

      - name: Backend e2e tests
        env:
          DB_TEST_HOST: 127.0.0.1
          DB_TEST_PORT: 3306
          DB_TEST_USERNAME: root
          DB_TEST_PASSWORD: root
          DB_TEST_DATABASE: todo_test
          MONGO_TEST_URL: mongodb://todo:todo@127.0.0.1:27017/todo_activity_test?authSource=admin
          JWT_SECRET: e2e-ci-secret-min-32-chars-123456
        run: npm run test:e2e --prefix backend

  mutation:
    runs-on: ubuntu-latest
    needs: verify

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: todo_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      mongo:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: root
          MONGO_APP_USERNAME: todo
          MONGO_APP_PASSWORD: todo
        ports:
          - 27017:27017
        volumes:
          - ${{ github.workspace }}/docker/db:/docker-entrypoint-initdb.d:ro
        options: >-
          --health-cmd="mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend deps
        run: npm ci --prefix backend

      - name: Backend mutation tests
        run: npm run test:mutation --prefix backend

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: backend/reports/mutation/
          if-no-files-found: warn

  smoke:
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Generate throwaway JWT secret
        run: echo "JWT_SECRET=$(openssl rand -base64 32)" > .env

      - name: Compose smoke (full stack via Caddy :80)
        run: npm run test:compose

