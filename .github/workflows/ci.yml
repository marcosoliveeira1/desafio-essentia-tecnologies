name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: todo_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend deps
        run: npm ci --prefix backend

      - name: Install frontend deps
        run: npm ci --prefix frontend

      - name: Backend typecheck
        run: npm run typecheck --prefix backend

      - name: Frontend typecheck
        run: npm run typecheck --prefix frontend

      - name: Backend lint
        run: npm run lint --prefix backend

      - name: Frontend lint
        run: npm run lint --prefix frontend

      - name: Backend audit
        run: npm audit --audit-level=high --prefix backend
        continue-on-error: true

      - name: Frontend audit
        run: npm audit --audit-level=high --prefix frontend
        continue-on-error: true

      - name: Prepare test database
        run: mysql -h127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS todo_test"

      - name: Backend unit tests
        run: npm test --prefix backend

      - name: Backend build
        run: npm run build --prefix backend

      - name: Frontend tests
        run: npm test --prefix frontend -- --watch=false

      - name: Frontend build
        run: npm run build --prefix frontend

      - name: Backend e2e tests
        env:
          DB_TEST_HOST: 127.0.0.1
          DB_TEST_PORT: 3306
          DB_TEST_USERNAME: root
          DB_TEST_PASSWORD: root
          DB_TEST_DATABASE: todo_test
          MONGO_TEST_URL: mongodb://127.0.0.1:27017/todo_activity_test
        run: npm run test:e2e --prefix backend

  smoke:
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Generate throwaway JWT secret
        run: echo "JWT_SECRET=$(openssl rand -base64 32)" > .env

      - name: Compose smoke (full stack via Caddy :80)
        run: npm run test:compose

